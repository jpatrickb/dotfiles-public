chezmoi:modify-template
{{- /*
  ~/.config/foot/foot.ini on Omarchy (foot is Omarchy's terminal; see .chezmoiignore for where this applies).

  A chezmoi "modify" template: it receives the CURRENT foot.ini as .chezmoi.stdin and prints the new content. It never
  replaces the file: Omarchy's own foot.ini (fonts, padding, the CSI-u key bindings, the include of its theme) stays
  untouched, and we only maintain ONE marked block, placed at the END of the [main] section so that it wins over
  anything above it (foot uses the last value). Re-applying replaces the block (never duplicates it); text you add
  elsewhere in the file is preserved. (chezmoi treats this file as a template, not a script, because of the marker on
  the FIRST line; it deletes every line containing that marker, so do not remove it or repeat its text. The file name
  must NOT end in .tmpl.)

  Why this block: copy-on-select, like Otty and Noctty. foot's default copies a selection to the PRIMARY selection
  only (middle-click paste); `selection-target=clipboard` also puts it on the system clipboard (verified in
  foot.ini(5): none, primary, clipboard or both; it lives in [main]).
*/ -}}
{{- $block := "# >>> dotfiles (chezmoi) >>>\n# Managed by chezmoi (modify_foot.ini in the dotfiles repo): edit the source, not this block.\n# Copy a selection to the system clipboard as soon as it is made (foot's default is the primary selection only).\nselection-target=clipboard\n# <<< dotfiles (chezmoi) <<<" -}}
{{- $cur := .chezmoi.stdin | default "" -}}
{{- /* Remove an earlier copy: the block and the ONE newline in front of it, nothing else. Insertion below adds exactly
       "\n"+block right after the last line of [main], so removing is its exact inverse: the file comes back byte for
       byte, the blank lines around it are never eaten, and re-applying is a fixed point (idempotent). */ -}}
{{- $cur = regexReplaceAll `(?s)\n?# >>> dotfiles \(chezmoi\) >>>.*?# <<< dotfiles \(chezmoi\) <<<` $cur "" -}}
{{- /* Insert at the end of [main]: after its last line, before the blank lines and the next [section] header (a header
       must start a line, so a value like key=[x] is never mistaken for one), or at the end of the file. */ -}}
{{- $out := regexReplaceAll `(?ms)(\[main\][^\n]*(?:\n.*?)??)(\n*)(^\[[A-Za-z0-9._-]+\]\n|\z)` $cur (print "${1}\n" $block "${2}${3}") -}}
{{- if not (contains "# >>> dotfiles (chezmoi) >>>" $out) -}}
{{- /* no [main] section at all (an empty or unusual file): add one */ -}}
{{- $out = print ($cur | trim) "\n\n[main]\n" $block -}}
{{- end -}}
{{ $out | trim }}
